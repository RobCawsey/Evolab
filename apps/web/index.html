<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evolab — slice 0</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0e0d15;
        --panel: #16151f;
        --line: #2c2a3a;
        --text: #e4e2ec;
        --dim: #8c8899;
        --faint: #5c5871;
        --amber: #e9a13b;
        --mono: "Cascadia Mono", "SF Mono", Consolas, monospace;
        --display: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--display);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex; align-items: center; gap: 14px;
        padding: 0 14px; height: 42px; flex: none;
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .brand { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; }
      .brand em { font-style: normal; color: var(--amber); }
      .chip {
        font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
        padding: 2px 7px; border-radius: 2px; border: 1px solid var(--line); color: var(--dim);
      }
      .spacer { flex: 1; }
      .hint { font-family: var(--mono); font-size: 11px; color: var(--faint); }
      main { flex: 1; position: relative; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: absolute; top: 12px; left: 12px;
        display: flex; flex-direction: column; gap: 4px;
        background: rgba(14, 13, 21, .82); border: 1px solid var(--line);
        border-radius: 3px; padding: 8px 11px; pointer-events: none;
      }
      #hud div { display: flex; gap: 12px; font-family: var(--mono); font-size: 11px; }
      #hud span { color: var(--faint); width: 74px; }
      #hud b { font-weight: 400; color: var(--text); font-variant-numeric: tabular-nums; }
      #hud b.fell { color: #d9625c; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Evo<em>lab</em></span>
      <span class="chip">slice 0 — it falls over</span>
      <span class="spacer"></span>
      <span class="hint">R — respawn &nbsp;·&nbsp; Space — pause &nbsp;·&nbsp; . — single step</span>
    </header>
    <main>
      <canvas id="stage"></canvas>
      <div id="hud">
        <div><span>seed</span><b id="v-seed">—</b></div>
        <div><span>sim time</span><b id="v-time">—</b></div>
        <div><span>steps</span><b id="v-steps">—</b></div>
        <div><span>torso y</span><b id="v-height">—</b></div>
        <div><span>state</span><b id="v-state">—</b></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
