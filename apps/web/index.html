<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evolab — slice 1</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0e0d15;
        --panel: #16151f;
        --panel2: #1f1e2a;
        --line: #2c2a3a;
        --text: #e4e2ec;
        --dim: #8c8899;
        --faint: #5c5871;
        --amber: #e9a13b;
        --cyan: #4ea8c4;
        --bad: #d9625c;
        --mono: "Cascadia Mono", "SF Mono", Consolas, monospace;
        --display: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--display);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex; align-items: center; gap: 14px;
        padding: 0 14px; height: 42px; flex: none;
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .brand { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; }
      .brand em { font-style: normal; color: var(--amber); }
      .chip {
        font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
        padding: 2px 7px; border-radius: 2px; border: 1px solid var(--line); color: var(--dim);
      }
      .spacer { flex: 1; }
      .hint { font-family: var(--mono); font-size: 11px; color: var(--faint); }
      button {
        font-family: var(--display); font-size: 12px; letter-spacing: .02em;
        padding: 4px 11px; border-radius: 3px; border: 1px solid var(--line);
        background: var(--panel2); color: var(--text); cursor: pointer;
      }
      button:hover { border-color: var(--faint); }
      :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

      main { flex: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 0; }

      aside {
        background: var(--panel); border-right: 1px solid var(--line);
        overflow-y: auto; padding: 10px 12px 20px;
      }
      .sl-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
      .sl-head {
        font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--dim); padding-bottom: 3px; border-bottom: 1px solid var(--line); margin-bottom: 3px;
      }
      .sl { display: grid; grid-template-columns: 62px 1fr 48px; align-items: center; gap: 7px; }
      .sl-name { font-size: 12px; color: var(--dim); }
      .sl-val {
        font-family: var(--mono); font-size: 11px; font-weight: 400; text-align: right;
        color: var(--text); font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 3px; border-radius: 2px; background: var(--line); outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 11px; height: 11px; border-radius: 50%;
        background: var(--text); cursor: pointer; border: none;
      }
      input[type="range"]::-moz-range-thumb {
        width: 11px; height: 11px; border-radius: 50%;
        background: var(--text); cursor: pointer; border: none;
      }

      .stage-wrap { position: relative; min-width: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: absolute; top: 12px; left: 12px;
        display: flex; flex-direction: column; gap: 4px;
        background: rgba(14, 13, 21, .82); border: 1px solid var(--line);
        border-radius: 3px; padding: 8px 11px; pointer-events: none;
      }
      #hud div { display: flex; gap: 12px; font-family: var(--mono); font-size: 11px; }
      #hud span { color: var(--faint); width: 66px; }
      #hud b { font-weight: 400; color: var(--text); font-variant-numeric: tabular-nums; }
      #hud b.fell { color: var(--bad); }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Evo<em>lab</em></span>
      <span class="chip">slice 1 — it walks, badly</span>
      <button id="btn-reset">Reset run</button>
      <button id="btn-default">Default gait</button>
      <span class="spacer"></span>
      <span class="hint">R — reset &nbsp;·&nbsp; G — ragdoll &nbsp;·&nbsp; Space — pause &nbsp;·&nbsp; . — step</span>
    </header>
    <main>
      <aside id="sliders"></aside>
      <div class="stage-wrap">
        <canvas id="stage"></canvas>
        <div id="hud">
          <div><span>sim time</span><b id="v-time">—</b></div>
          <div><span>distance</span><b id="v-distance">—</b></div>
          <div><span>gait phase</span><b id="v-phase">—</b></div>
          <div><span>torso y</span><b id="v-height">—</b></div>
          <div><span>state</span><b id="v-state">—</b></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
